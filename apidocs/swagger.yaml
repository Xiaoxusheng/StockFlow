basePath: /
definitions:
  github_com_stockflow_server_internal_response.Envelope:
    properties:
      code:
        description: 成功 0（数字）；失败为模块命名空间错误码字符串（COMMON_* 等）
      data: {}
      details:
        description: 校验失败必带（api.md §4）
      message:
        type: string
      request_id:
        type: string
    type: object
  internal_auth.AssignPermissionsInput:
    properties:
      permission_ids:
        items:
          type: integer
        type: array
    type: object
  internal_auth.AssignRolesInput:
    properties:
      role_ids:
        items:
          type: integer
        type: array
    type: object
  internal_auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  internal_auth.DeptCreateInput:
    properties:
      code:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      status:
        type: string
    type: object
  internal_auth.DeptUpdateInput:
    properties:
      name:
        type: string
      parent_id:
        type: integer
    type: object
  internal_auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.ResetPasswordInput:
    properties:
      new_password:
        type: string
    type: object
  internal_auth.RoleCreateInput:
    properties:
      code:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  internal_auth.RoleUpdateInput:
    properties:
      name:
        type: string
    type: object
  internal_auth.StatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  internal_auth.UserCreateInput:
    properties:
      data_scope:
        type: string
      department_id:
        type: integer
      email:
        type: string
      password:
        type: string
      phone:
        type: string
      real_name:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      username:
        type: string
      warehouse_ids:
        items:
          type: integer
        type: array
    type: object
  internal_auth.UserUpdateInput:
    properties:
      data_scope:
        type: string
      department_id:
        type: integer
      email:
        type: string
      phone:
        type: string
      real_name:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      warehouse_ids:
        items:
          type: integer
        type: array
    type: object
  internal_datax.ConfirmInput:
    properties:
      confirmed:
        type: boolean
    type: object
  internal_datax.ExportCreateInput:
    properties:
      filters:
        additionalProperties:
          type: string
        type: object
      ids:
        items:
          type: string
        type: array
      module:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      scope:
        type: string
      time_from:
        type: string
      time_to:
        type: string
    type: object
  internal_devices.ActivateInput:
    properties:
      app_version:
        type: string
      brand:
        type: string
      device_code:
        type: string
      model:
        type: string
      os:
        type: string
      token:
        type: string
    type: object
  internal_devices.DeviceCreateInput:
    properties:
      brand:
        type: string
      code:
        type: string
      model:
        type: string
      name:
        type: string
      remark:
        type: string
      type:
        type: string
      warehouse_id:
        description: 0=暂不绑定（devices.md §6.3 可后续绑定）
        type: integer
    type: object
  internal_devices.HeartbeatInput:
    properties:
      app_version:
        type: string
      battery_level:
        type: integer
      last_error:
        type: string
    type: object
  internal_devices.ResolveInput:
    properties:
      code:
        type: string
      page:
        type: string
      symbology:
        type: string
    type: object
  internal_printing.ExecuteInput:
    properties:
      message:
        type: string
      result:
        type: string
    type: object
  internal_printing.TaskCreateInput:
    properties:
      copies:
        type: integer
      data_ids:
        items:
          type: string
        type: array
      template_id:
        type: integer
    type: object
  internal_printing.TemplateSaveInput:
    properties:
      barcode_symbology:
        type: string
      fields:
        items:
          type: string
        type: array
      header_text:
        type: string
      name:
        type: string
      object_type:
        type: string
      paper:
        type: string
      qrcode_enabled:
        type: boolean
      remark:
        type: string
    type: object
  internal_purchase.CancelInput:
    properties:
      reason:
        type: string
    type: object
  internal_returns.ApproveInput:
    properties:
      approved:
        type: boolean
      opinion:
        type: string
    type: object
  internal_returns.CancelInput:
    properties:
      reason:
        type: string
    type: object
  internal_returns.ExceptionAssignInput:
    properties:
      assignee_id:
        type: integer
      assignee_name:
        type: string
    type: object
  internal_returns.ExceptionCreateInput:
    properties:
      bin_id:
        description: 可空定位：0=未定位
        type: integer
      detail:
        type: string
      freeze_batch_id:
        description: 0=非批次 SKU
        type: integer
      freeze_enabled:
        description: |-
          冻结选项：定位到具体库存行时才可冻结（仓库+库位+SKU 定位，inventory-rules §4.1）；
          FreezeQty 为冻结量（解冻释放取量依据）。
        type: boolean
      freeze_qty:
        type: string
      freeze_warehouse_id:
        type: integer
      owner_id:
        type: integer
      owner_name:
        type: string
      remark:
        type: string
      serial_no:
        type: string
      sku_id:
        description: 可空定位：0=未定位
        type: integer
      source_no:
        type: string
      source_type:
        description: 产生环节的单据类型（收货/拣货/复核/盘点等）
        type: string
      type:
        description: 九类中文值域（business-flow §11.2）
        type: string
    type: object
  internal_returns.ExceptionImageInput:
    properties:
      file_ids:
        description: |-
          FileIDs 文件中心上传返回的文件 ID（database.ID 反序列化同时接受字符串与数字，
          对齐全仓「业务 ID 字符串」约定）。
        items:
          type: integer
        type: array
    type: object
  internal_returns.PurchaseReturnCreateInput:
    properties:
      lines:
        items:
          $ref: '#/definitions/internal_returns.PurchaseReturnLineInput'
        type: array
      po_no:
        type: string
      remark:
        type: string
      supplier_id:
        type: integer
      warehouse_id:
        type: integer
    type: object
  internal_returns.PurchaseReturnLineInput:
    properties:
      line_no:
        type: integer
      qty_return:
        type: string
      reason:
        type: string
      remark:
        type: string
      sku_id:
        type: integer
    type: object
  internal_returns.QCResultInput:
    properties:
      lines:
        items:
          $ref: '#/definitions/internal_returns.QCResultLineInput'
        type: array
      qc_no:
        type: string
    type: object
  internal_returns.QCResultLineInput:
    properties:
      batch_id:
        type: integer
      bin_id:
        type: integer
      line_no:
        type: integer
      qty_defective:
        type: string
      qty_qualified:
        type: string
      serials_passed:
        description: |-
          SerialsPassed 质检合格逐件序列号（可选，序列号 SKU 逐件回 IN_STOCK；
          不良件保持 RETURNED 待处置）。
        items:
          type: string
        type: array
      shelf_id:
        type: integer
      zone_id:
        type: integer
    type: object
  internal_returns.ReceiveInput:
    properties:
      lines:
        items:
          $ref: '#/definitions/internal_returns.ReceiveLineInput'
        type: array
    type: object
  internal_returns.ReceiveLineInput:
    properties:
      batch_no:
        type: string
      bin_id:
        type: integer
      line_no:
        type: integer
      qty:
        type: string
      serials:
        items:
          type: string
        type: array
      shelf_id:
        type: integer
      zone_id:
        type: integer
    type: object
  internal_returns.SalesReturnCreateInput:
    properties:
      customer_id:
        type: integer
      lines:
        items:
          $ref: '#/definitions/internal_returns.SalesReturnLineInput'
        type: array
      remark:
        type: string
      so_no:
        type: string
      warehouse_id:
        type: integer
    type: object
  internal_returns.SalesReturnLineInput:
    properties:
      line_no:
        type: integer
      qty_return:
        type: string
      reason:
        type: string
      remark:
        type: string
      sku_id:
        type: integer
    type: object
  internal_returns.ShipInput:
    properties:
      lines:
        items:
          $ref: '#/definitions/internal_returns.ShipLineInput'
        type: array
    type: object
  internal_returns.ShipLineInput:
    properties:
      batch_id:
        type: integer
      bin_id:
        type: integer
      line_no:
        type: integer
      qty:
        type: string
      serials:
        items:
          type: string
        type: array
      shelf_id:
        type: integer
      zone_id:
        type: integer
    type: object
  internal_returns.SubmitQCInput:
    properties:
      remark:
        type: string
    type: object
  internal_sales.ApproveInput:
    properties:
      action:
        description: APPROVE / REJECT
        type: string
      opinion:
        type: string
    type: object
  internal_sales.CancelInput:
    properties:
      reason:
        type: string
    type: object
  internal_sales.CheckConfirmInput:
    properties:
      pass:
        type: boolean
      result:
        type: string
      serial:
        description: 序列号任务必填：重新扫描确认的序列号（§8.3 逐件确认）
        type: string
    type: object
  internal_sales.CloseInput:
    properties:
      reason:
        type: string
    type: object
  internal_sales.CreateOrderInput:
    properties:
      customer_id:
        type: integer
      delivery_method:
        type: string
      items:
        items:
          $ref: '#/definitions/internal_sales.OrderItemInput'
        type: array
      remark:
        type: string
      shipping_address:
        type: string
      warehouse_id:
        type: integer
    type: object
  internal_sales.OrderItemInput:
    properties:
      line_no:
        type: integer
      price:
        type: integer
      qty:
        type: integer
      remark:
        type: string
      sku_id:
        type: integer
    type: object
  internal_sales.PackInput:
    properties:
      carrier:
        type: string
      height:
        type: integer
      idempotency_key:
        type: string
      length:
        type: integer
      lines:
        items:
          $ref: '#/definitions/internal_sales.PackLineInput'
        type: array
      outbound_no:
        type: string
      packing_material:
        type: string
      remark:
        type: string
      tracking_no:
        type: string
      volume:
        type: integer
      weight:
        type: integer
      width:
        type: integer
    type: object
  internal_sales.PackLineInput:
    properties:
      line_no:
        type: integer
      qty:
        type: integer
    type: object
  internal_sales.PickConfirmInput:
    properties:
      picked_qty:
        type: integer
      scanned_code:
        description: 扫码录入值（M2 记录不解析，plan §12 扫码不做）
        type: string
      serials:
        description: 序列号 SKU 必填：逐件采集（inventory-rules §8.2）
        items:
          type: string
        type: array
    type: object
  internal_sales.ReallocateInput:
    properties:
      line_no:
        type: integer
      outbound_no:
        type: string
    type: object
  internal_sales.ShipInput:
    properties:
      carrier:
        type: string
      idempotency_key:
        type: string
      lines:
        description: 缺省 = 全部未发货明细行
        items:
          $ref: '#/definitions/internal_sales.ShipLineInput'
        type: array
      outbound_no:
        type: string
      remark:
        type: string
      tracking_no:
        type: string
    type: object
  internal_sales.ShipLineInput:
    properties:
      line_no:
        type: integer
    type: object
  internal_sales.ShipStatusInput:
    properties:
      remark:
        type: string
      status:
        description: SHIPPED 后续：IN_TRANSIT / SIGNED / ABNORMAL
        type: string
    type: object
  internal_stockops.MoveInput:
    properties:
      from:
        $ref: '#/definitions/internal_stockops.MoveKeyInput'
      qty:
        description: numeric(18,4) 文本
        type: string
      remark:
        type: string
      source_no:
        description: 作业依据号（必填，流水追溯）
        type: string
      to:
        $ref: '#/definitions/internal_stockops.MoveKeyInput'
    type: object
  internal_stockops.MoveKeyInput:
    properties:
      batch_id:
        type: integer
      bin_id:
        type: integer
      shelf_id:
        type: integer
      sku_id:
        type: integer
      warehouse_id:
        type: integer
      zone_id:
        type: integer
    type: object
  internal_sysops.jobStatusPayload:
    properties:
      enabled:
        type: boolean
    type: object
  internal_sysops.saveConfigsPayload:
    properties:
      items:
        items:
          properties:
            key:
              type: string
            value:
              type: string
          type: object
        type: array
    type: object
  internal_warehouse.BinCreateInput:
    properties:
      bin_type:
        description: 缺省 PICK
        type: string
      code:
        type: string
      column_no:
        type: integer
      layer:
        description: 缺省 1
        type: integer
      max_capacity:
        type: number
      shelf_id:
        type: integer
      warehouse_id:
        type: integer
      zone_id:
        type: integer
    required:
    - code
    - shelf_id
    type: object
  internal_warehouse.BinUpdateInput:
    properties:
      bin_type:
        type: string
      code:
        type: string
      column_no:
        type: integer
      layer:
        type: integer
      max_capacity:
        type: number
    type: object
  internal_warehouse.ShelfCreateInput:
    properties:
      capacity:
        type: number
      code:
        type: string
      columns:
        type: integer
      layers:
        description: 缺省 1
        type: integer
      warehouse_id:
        description: 可选：提供时必须与 zone 归属一致
        type: integer
      zone_id:
        type: integer
    required:
    - code
    - zone_id
    type: object
  internal_warehouse.ShelfUpdateInput:
    properties:
      capacity:
        type: number
      code:
        type: string
      columns:
        type: integer
      layers:
        type: integer
    type: object
  internal_warehouse.StatusInput:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  internal_warehouse.WarehouseCreateInput:
    properties:
      address:
        type: string
      area:
        type: number
      capacity:
        type: number
      code:
        type: string
      contact:
        type: string
      manager_user_id:
        type: integer
      name:
        type: string
      phone:
        type: string
      type:
        type: string
    required:
    - code
    - name
    type: object
  internal_warehouse.WarehouseUpdateInput:
    properties:
      address:
        type: string
      area:
        type: number
      capacity:
        type: number
      code:
        type: string
      contact:
        type: string
      manager_user_id:
        type: integer
      name:
        type: string
      phone:
        type: string
      type:
        type: string
    type: object
  internal_warehouse.ZoneCreateInput:
    properties:
      capacity:
        type: number
      code:
        type: string
      name:
        type: string
      warehouse_id:
        type: integer
      zone_type:
        description: 缺省 STORAGE
        type: string
    required:
    - code
    - name
    - warehouse_id
    type: object
  internal_warehouse.ZoneUpdateInput:
    properties:
      capacity:
        type: number
      code:
        type: string
      name:
        type: string
      zone_type:
        type: string
    type: object
info:
  contact: {}
  description: StockFlow（库流智能仓储管理系统）后端 API。统一信封 {code,message,data,request_id,details}（api.md
    §2）。
  title: StockFlow API
  version: "1.0"
paths:
  /api/allocations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: GET /api/allocations
      tags:
      - 销售出库
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_sales.ReallocateInput'
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: 重新分配（释放旧锁 + 重分配 + 记录替换，同事务）
      tags:
      - 销售出库
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: POST /api/auth/login
      tags:
      - 认证与用户
  /api/auth/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: POST /api/auth/logout
      tags:
      - 认证与用户
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: GET /api/auth/me
      tags:
      - 认证与用户
  /api/auth/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: PUT /api/auth/password
      tags:
      - 认证与用户
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: POST /api/auth/refresh
      tags:
      - 认证与用户
  /api/auth/sessions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: GET /api/auth/sessions（auth:session:list；内存分页满足强制分页）
      tags:
      - 认证与用户
  /api/auth/sessions/{id}:
    delete:
      parameters:
      - description: 会话 SID（Redis 会话键 sid，字符串形态；非数字 ID）
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: DELETE /api/auth/sessions/:id（auth:session:kick；强制审计）
      tags:
      - 认证与用户
  /api/batches:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应信封
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_stockflow_server_internal_response.Envelope'
      summary: GET /api/batches
      tags:
      - 库存
  /api/bins:
    get:
      produces:
      - application/json
